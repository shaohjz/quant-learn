# 选股逻辑说明 — 展示在 Web 页面观察列表
# 每个来源的选股策略
stock_selection_logic:
  玄鉴录:
    description: "玄鉴录量化选股模型推荐"
    strategy: "基于行业轮动+技术面筛选，选出具备MA突破潜力的标的"
    criteria:
      - "行业景气度上行"
      - "价格在MA20附近或下方（有安全边际）"
      - "近期成交量温和放大"
      - "市值适中（50-500亿）"
    
  涛哥推荐:
    description: "涛哥（实战经验丰富的朋友）推荐"
    strategy: "基于盘面异动+基本面判断的主观推荐"
    criteria:
      - "近期有异动（涨停/放量/突破）"
      - "行业龙头或细分赛道领先"
      - "回调后有明确支撑位"

  用户指定:
    description: "自己观察发现的标的"
    strategy: "个人研究+盘面观察，发现后加入等回调"
    criteria:
      - "近期强势（涨停/创新高）"
      - "不追高，等MA10/MA20回踩"
      - "设定明确买入阈值"

  intraday_scanner:
    description: "盘中异动扫描器自动发现"
    strategy: "全市场800只（沪深300+中证500）实时扫描"
    criteria:
      - "量价突破: 价格>MA20 + 量比≥1.5 + 涨幅1-5%"
      - "涨停回落: 早盘涨停后回落至5-8%"
      - "超跌反弹: 近5日跌>10%后放量反弹"
    scoring: "异动评分≥60分入选"
