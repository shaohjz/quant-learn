# config.yaml — 量化交易系统配置（单一真源 / 2026-05-22 重构）
#
# 推荐用法：把账户敏感配置放到 config.local.yaml（已加入 .gitignore），
# config.local.yaml 会覆盖本文件的同名字段。
#
# 设计原则：
#   - 持仓 / 现金 / 阈值规则均以本文件为准，所有脚本统一读这里
#   - 真实账户（real）由用户手动同步，仅监控告警；
#     学习账户（learn）由 vqlearn 自动下单
#   - 数据库 sim_live_mirror.db 是运行时镜像，不是真源；
#     用 scripts/sync_real_position.py 来同步真实交易


# ========== 双账户 ==========
accounts:
  learn:
    account_id: 1                # 数据库 sim_account.id
    account_name: live_mirror
    initial_cash: 100000.00      # 学习账户初始资金 10 万
    auto_trade: true             # vqlearn 实盘策略自动下单
    max_total_value: 100000.00   # 总资产硬上限（含市值），达上限不再买入
    description: "vqlearn 量化策略自学习账户，自动下单"

  real:
    account_id: 2
    account_name: real_portfolio
    initial_cash: 25000.00       # 用户实际初始资金（约略，用于历史对比）
    auto_trade: false            # 仅监控告警，绝不下单
    description: "用户实际持仓镜像，由 scripts/sync_real_position.py 维护"


# ========== 真实持仓（snapshot — 数据库为权威，本块仅用于规则匹配/便于审计） ==========
# 注：实际数量/成本/现价 以 sim_positions(account_id=2) 为准；
#     这里只描述【告警规则】，让告警脚本知道每只股的止损/止盈/观察阈值。
real_portfolio_rules:
  "600330":
    name: 天通股份
    rules:
      stop_loss:    { trigger: 27.00, dir: below, msg: "🚨 跌破 MA20 止损线！立即挂卖 400 股 @市价" }
      half_out:     { trigger: 32.00, dir: above, msg: "✅ 回到 32 回本线！建议挂卖 200 股 @32.00" }
      take_profit:  { trigger: 35.00, dir: above, msg: "🎉 突破 35！建议清仓剩余 200 股 @35.00" }

  "002453":
    name: 华软科技
    rules:
      stop_loss_tight: { trigger: 5.95, dir: below, msg: "⚠️ 跌破 5.95！已接近 -8% 止损线，考虑卖出 300 股" }
      stop_loss:       { trigger: 5.80, dir: below, msg: "🚨 跌破 5.80！硬止损卖出 300 股" }
      half_out:        { trigger: 6.80, dir: above, msg: "📈 涨到 6.80！建议挂卖 150 股" }
      take_profit:     { trigger: 7.20, dir: above, msg: "🎉 涨至 7.20！清仓剩余 150 股" }

  "603601":
    name: 再升科技
    rules:
      stop_loss:        { trigger: 16.24, dir: below, msg: "🚨 再升科技跌破 MA20 (16.24)！题材冷却，考虑止损卖 100 股" }
      hard_stop:        { trigger: 15.00, dir: below, msg: "🚨🚨 再升科技跌破 15.00！硬止损（-15.8%）必须卖 100 股" }
      take_profit_half: { trigger: 19.50, dir: above, msg: "🎉 涨到 19.50！出一半保本息利" }
      take_profit:      { trigger: 21.00, dir: above, msg: "🎉🎉 涨到 21.00！题材股高位，清仓 100 股" }


