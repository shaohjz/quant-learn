risk:
  cash_ratio_crit: 0.02
  cash_ratio_warn: 0.05
  liquidity_release_loss_threshold: 0.08
  max_daily_build_amount_pct: 0.3
  # 赚钱闸：日新建仓从 3→1，少追弱市连买（#1 近周 -5.9% 主因之一）
  max_daily_new_positions: 1
  max_daily_trades: 10
  max_cross_industry_count: 3
  max_industry_pct: 0.3
  # 单票上限 15%（原 20% 未接入执行器导致京东方堆仓）；sim_executor 现强制执行
  max_position_pct: 0.15
  max_sector_pct: 0.35
  # 2026-08-01 假设 H-002：5 仓 × 1 万预算 = 5 万，撑不满 10 万本金，
  # 一半资金结构性闲置。提到 8 仓后上限 8 万（80%），仍留 2 万现金缓冲；
  # 单笔预算不动（1 万 = 10%，低于 max_position_pct 15%），不抬高集中度。
  # 每日新开仓上限 1 笔，建满需 8 天。复核日 2026-08-22，不达预期回退为 5。
  max_total_positions: 8
  stop_loss_pct: -0.08
  take_profit_pct: 0.15
  # 弱势日禁买：任一宽基指数跌幅 ≤ 该值则拒绝 buy_zone/buy_strong
  market_panic_enabled: true
  market_panic_index_drop_pct: -1.0
  # 浮亏加仓禁：持仓浮亏超过该比例（负值）时禁止加仓
  block_add_to_loser_pct: -3.0
  # Pause buy_strong until paper sample is large enough; buy_zone remains active.
  buy_strong_enabled: false
  # Same-day reverse guard still blocks fluff exits, but hard -8% cost breach may sell.
  hard_stop_bypasses_same_day: true
  # First take-profit / +1R: sell half; runner rides ATR trailing stop.
  take_profit_mode: half
  scale_out:
    enabled: true
    at_r: 1.0
    min_qty: 200
    allow_same_day: true
  trailing:
    mode: atr_hybrid
    activate_profit_pct: 5.0
    atr_mult: 2.0
    default_atr_pct: 3.0
  warn_industry_pct: 0.25
  warn_sector_pct: 0.3
  post_buy_protection:
    protect_minutes: 120
    # Align with stop_loss_pct: do not let protected losers drift to -15%.
    protect_loss_pct: -8.0
