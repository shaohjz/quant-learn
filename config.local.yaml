# config.local.yaml — 本地敏感配置（不进 git）
# 此文件已被 .gitignore 排除。
# 字段会覆盖 config.yaml 同名字段。

# ========== 交易模式 ==========
# 重要：默认仍然 sim（模拟），等 QMT 装好、xtquant 装好、QMTBroker 实现完，
# 再手动改成 live。绝对不要在没确认的情况下切到 live！
broker:
  mode: "sim"            # 当前保持 sim；周三 5/21 dry_run 跑通后改成 live

  live:
    # 国金证券模拟账户（mini-QMT）
    qmt_account: "90072426"

    # ⚠️ 注意 mini 后缀：实际 QMT mini 客户端路径
    qmt_path: "D:\\国金QMT交易端模拟\\userdata_mini"

    # 会话 ID，自己取个随机数避免和别的程序冲突
    session_id: 970515

    # ★ Dry-run 开关：true 时 buy/sell 不真的调 order_stock，只 log
    # 5/20 dry-run 跑通 → 5/21 改成 false 真下单（仅 QMT 模拟账户）
    dry_run: true

    # xtquant 的 site-packages 路径（让主项目 venv 不装 xtquant 也能 import）
    xtquant_site_packages: "D:\\国金QMT交易端模拟\\bin.x64\\Lib\\site-packages"

# ★ 双账户硬约束
# 真实账户 8890461376 — 永远不连接、不下单、不 import
# QMT 模拟账户 90072426 — 主项目操作目标
safety:
  forbidden_real_account: "8890461376"
  qmt_sim_account: "90072426"

# ========== 推送通知 ==========
# 推送通知
notifier:
  wecom_webhook: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=485ed901-c66f-4aea-8144-d1593fc1259d"

# ⚠️ 注意：
# 1. QMT 登录密码由你手动在 QMT 客户端登录时输入，不在这里存
# 2. 如果国金重新发了新的测试账号，更新 qmt_account 字段即可
# 3. 实盘账号 8890461376 暂时不要写到这里，要切到实盘前先和 AI 确认一遍
