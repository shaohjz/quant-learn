<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 量化仪表盘</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #1a1a2e; color: #eee; padding: 20px; }
.header { text-align: center; margin-bottom: 20px; }
.header h1 { font-size: 24px; color: #00d4ff; }
.header .time { color: #888; font-size: 14px; margin-top: 5px; }
.tabs { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
.tab { padding: 8px 20px; border-radius: 20px; cursor: pointer; font-size: 14px; border: 1px solid #333; background: #16213e; color: #aaa; transition: all 0.3s; user-select: none; }
.tab.active { background: #00d4ff; color: #000; border-color: #00d4ff; font-weight: bold; }
.tab:hover { border-color: #00d4ff; }
.summary { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
.card { background: #16213e; border-radius: 12px; padding: 15px 20px; flex: 1; min-width: 140px; }
.card .label { color: #888; font-size: 12px; }
.card .value { font-size: 20px; font-weight: bold; margin-top: 5px; }
.pos { color: #00e676; }
.neg { color: #ff5252; }
.stock-row { background: #16213e; border-radius: 10px; margin-bottom: 8px; cursor: pointer; transition: background 0.2s; }
.stock-row:hover { background: #1a2745; }
.stock-main { display: flex; padding: 12px 15px; align-items: center; gap: 15px; flex-wrap: wrap; }
.stock-main .code { color: #888; font-size: 12px; min-width: 60px; }
.stock-main .name { font-weight: bold; min-width: 80px; }
.stock-main .qty { color: #aaa; font-size: 13px; min-width: 60px; }
.stock-main .price { min-width: 70px; }
.stock-main .pct { min-width: 60px; font-weight: bold; }
.stock-main .pnl { min-width: 80px; }
.stock-main .arrow { margin-left: auto; color: #555; transition: transform 0.2s; }
.stock-row.open .arrow { transform: rotate(180deg); }
.stock-detail { display: none; padding: 0 15px 12px; border-top: 1px solid #222; }
.stock-row.open .stock-detail { display: block; }
.trade-list { font-size: 12px; color: #aaa; padding-top: 8px; }
.trade-list .trade-item { padding: 4px 0; display: flex; gap: 10px; border-bottom: 1px solid #1a1a2e; }
.trade-list .trade-item .buy { color: #00e676; }
.trade-list .trade-item .sell { color: #ff5252; }
.no-trades { color: #555; font-size: 12px; padding: 8px 0; }
h2 { color: #00d4ff; margin: 15px 0 10px; font-size: 16px; }
.footer { text-align: center; color: #555; font-size: 12px; margin-top: 30px; }
.hidden { display: none; }
.btn { background: #0f3460; color: #00d4ff; border: 1px solid #00d4ff; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; }
.btn:hover { background: #00d4ff; color: #000; }
</style>
</head>
<body>
<div class="header">
  <h1>📊 量化持仓仪表盘</h1>
  <div class="time">更新: <span id="update-time">-</span> <button class="btn" onclick="refresh()">🔄</button></div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="real" onclick="switchTab(this,'real')">💼 实盘</div>
  <div class="tab" data-tab="sim" onclick="switchTab(this,'sim')">🧪 模拟盘</div>
</div>

<!-- 实盘 -->
<div id="panel-real">
<div class="summary">
  <div class="card"><div class="label">总资产</div><div class="value" id="r-total-asset">-</div></div>
  <div class="card"><div class="label">现金</div><div class="value" id="r-cash">-</div></div>
  <div class="card"><div class="label">仓位</div><div class="value" id="r-position-pct">-</div></div>
  <div class="card"><div class="label">浮动盈亏</div><div class="value" id="r-total-pnl">-</div></div>
  <div class="card"><div class="label">总收益率</div><div class="value" id="r-total-return">-</div></div>
</div>
<h2>📈 实盘持仓 <span style="font-size:12px;color:#666">(点击查看交易历史)</span></h2>
<div id="r-positions">加载中...</div>
</div>

<!-- 模拟盘 -->
<div id="panel-sim" class="hidden">
<div class="summary">
  <div class="card"><div class="label">总资产</div><div class="value" id="s-total-asset">-</div></div>
  <div class="card"><div class="label">现金</div><div class="value" id="s-cash">-</div></div>
  <div class="card"><div class="label">持仓市值</div><div class="value" id="s-market-value">-</div></div>
  <div class="card"><div class="label">浮动盈亏</div><div class="value" id="s-total-pnl">-</div></div>
  <div class="card"><div class="label">总收益率</div><div class="value" id="s-total-return">-</div></div>
</div>
<h2>📈 模拟盘持仓 <span style="font-size:12px;color:#666">(点击查看交易历史)</span></h2>
<div id="s-positions">加载中...</div>
</div>

<div class="footer">quant-learn | 数据: 新浪行情 | 自动刷新 30s | 点击股票可展开/收起交易历史</div>

<script>
function fmt(n) { return n >= 0 ? '+' + n.toFixed(2) : n.toFixed(2); }
function cls(n) { return n >= 0 ? 'pos' : 'neg'; }
let tradesCache = {};

function switchTab(el, tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('[id^="panel-"]').forEach(p => p.classList.add('hidden'));
  el.classList.add('active');
  document.getElementById('panel-' + tab).classList.remove('hidden');
}

function toggleStock(el) {
  el.classList.toggle('open');
  const code = el.dataset.code;
  const detail = el.querySelector('.stock-detail');
  if (el.classList.contains('open') && !detail.dataset.loaded) {
    loadTrades(code, detail);
  }
}

async function loadTrades(code, container) {
  container.innerHTML = '<div class="trade-list">加载中...</div>';
  try {
    const res = await fetch('/api/stock_trades/' + code);
    const data = await res.json();
    if (data.trades && data.trades.length > 0) {
      let html = '<div class="trade-list">';
      data.trades.forEach(t => {
        const dirCls = t.direction === 'BUY' ? 'buy' : 'sell';
        const dirText = t.direction === 'BUY' ? '买入' : '卖出';
        const time = t.trade_time || '';
        html += '<div class="trade-item">' +
          '<span>' + t.trade_date + ' ' + time + '</span>' +
          '<span class="' + dirCls + '">' + dirText + '</span>' +
          '<span>' + t.quantity + '股</span>' +
          '<span>@¥' + t.price.toFixed(3) + '</span>' +
          '<span>¥' + (t.amount||0).toFixed(0) + '</span>' +
          '</div>';
      });
      html += '</div>';
      container.innerHTML = html;
    } else {
      container.innerHTML = '<div class="no-trades">暂无交易记录</div>';
    }
    container.dataset.loaded = '1';
  } catch(e) {
    container.innerHTML = '<div class="no-trades">加载失败</div>';
  }
}

function renderStockCards(positions, containerId) {
  let html = '';
  positions.forEach(p => {
    const pnlCls = cls(p.pnl_pct);
    const todayCls = cls(p.pct_today);
    html += '<div class="stock-row" data-code="' + p.code + '" onclick="toggleStock(this)">' +
      '<div class="stock-main">' +
      '<span class="code">' + p.code + '</span>' +
      '<span class="name">' + p.name + '</span>' +
      '<span class="qty">' + p.quantity + '股</span>' +
      '<span class="price">¥' + p.current_price.toFixed(2) + '</span>' +
      '<span class="pct ' + todayCls + '">' + fmt(p.pct_today) + '%</span>' +
      '<span class="pnl ' + pnlCls + '">' + (p.pnl>=0?'+':'') + '¥' + p.pnl.toFixed(0) + ' (' + fmt(p.pnl_pct) + '%)</span>' +
      '<span class="arrow">▼</span>' +
      '</div>' +
      '<div class="stock-detail"></div>' +
      '</div>';
  });
  document.getElementById(containerId).innerHTML = html || '<div style="color:#555;padding:20px">暂无持仓</div>';
}

async function refresh() {
  try {
    // 实盘
    const rRes = await fetch('/api/real_portfolio');
    const rData = await rRes.json();
    if (!rData.error) {
      document.getElementById('r-total-asset').textContent = '¥' + rData.account.total_asset.toLocaleString();
      document.getElementById('r-cash').textContent = '¥' + rData.account.cash.toLocaleString();
      document.getElementById('r-position-pct').textContent = rData.account.position_pct + '%';
      const rpnl = document.getElementById('r-total-pnl');
      rpnl.textContent = (rData.total_pnl>=0?'+':'') + '¥' + rData.total_pnl.toFixed(0);
      rpnl.className = 'value ' + cls(rData.total_pnl);
      const rret = document.getElementById('r-total-return');
      rret.textContent = fmt(rData.account.total_return_pct) + '%';
      rret.className = 'value ' + cls(rData.account.total_return_pct);
      renderStockCards(rData.positions, 'r-positions');
      document.getElementById('update-time').textContent = rData.updated_at;
    }

    // 模拟盘
    const sRes = await fetch('/api/portfolio');
    const sData = await sRes.json();
    document.getElementById('s-total-asset').textContent = '¥' + sData.account.total_asset.toLocaleString();
    document.getElementById('s-cash').textContent = '¥' + sData.account.cash.toLocaleString();
    document.getElementById('s-market-value').textContent = '¥' + sData.total_market_value.toLocaleString();
    const spnl = document.getElementById('s-total-pnl');
    spnl.textContent = (sData.total_pnl>=0?'+':'') + '¥' + sData.total_pnl.toFixed(0);
    spnl.className = 'value ' + cls(sData.total_pnl);
    const sret = document.getElementById('s-total-return');
    sret.textContent = fmt(sData.account.total_return_pct) + '%';
    sret.className = 'value ' + cls(sData.account.total_return_pct);
    renderStockCards(sData.positions, 's-positions');
  } catch(e) { console.error(e); }
}

refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
