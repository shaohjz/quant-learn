# config.yaml — 量化交易系统配置（提交时不要写敏感信息）
#
# 推荐用法：把账户敏感配置放到 config.local.yaml（已加入 .gitignore），
# config.local.yaml 会覆盖本文件的同名字段。

# ========== 资金 ==========
account:
  initial_cash: 20000   # 初始资金（贴近真实可交易金额）
  account_id: 1

# ========== 股票池 ==========
# 注意：当前国金账户只能交易深市（000/002/300 开头），沪市未开通
stock_pool:
  - code: "000967"
    name: "盈峰环境"
    enabled: true
  - code: "002256"
    name: "兆新股份"
    enabled: true
  - code: "002453"
    name: "华软科技"
    enabled: false   # 暂未启用，开仓前再切

# ========== 风控 ==========
risk:
  max_position_pct: 0.60      # 单只股票最大仓位
  max_daily_trades: 5         # 每日最大交易笔数
  stop_loss_pct: -0.08        # 止损线
  take_profit_pct: 0.15       # 止盈线

# ========== 费用模型 ==========
fees:
  commission_rate: 0.0003     # 佣金万3
  min_commission: 5.0         # 最低佣金 5 元
  stamp_tax_rate: 0.001       # 印花税千1（仅卖出）
  unit_size: 100              # 交易单位（A 股 100 股）

# ========== 推送通知 ==========
notifier:
  enabled: true
  # 企微群机器人 webhook URL
  # 获取方法：建个企微群 → 右上角 → 添加群机器人 → 拿 webhook
  # 详细文档：https://developer.work.weixin.qq.com/document/path/91770
  # 敏感：实际值建议写到 config.local.yaml不交仓库
  wecom_webhook: ""

# ========== 交易模式 ==========
broker:
  mode: "sim"                 # sim / live
  sim:
    slippage: 0.0             # 模拟盘滑点
  live:
    # qmt_path / qmt_account 不要写在这里，
    # 通过环境变量 QMT_USERDATA_MINI / QMT_ACCOUNT_ID 注入
    session_id: 123456
